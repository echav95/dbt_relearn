sources:
  - name: ANALYTICS
    schema: DBT_ECHAVEZ
    tables:
      - name: listings
        identifier: raw_listings
        columns:
          - name: room_type
            tests:
              - dbt_expectations.expect_column_distinct_count_to_equal:
                  arguments:
                    expression: "room_type = 4"

      - name: hosts
        identifier: raw_hosts

      - name: reviews
        identifier: raw_reviews